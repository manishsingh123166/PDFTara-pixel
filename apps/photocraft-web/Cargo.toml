[package]
name = "pdftara-pixel-web"
description = "PDFTara Pixel Web - Professional browser-based photo editor built with Rust, WebGPU and WebGL2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open HEIC/HEIF photos
heif = ["craft-codecs/heif"]

[lints]
workspace = true

[[bin]]
name = "pdftara-pixel-web"
path = "src/main.rs"

[dependencies]
craft-engine = { workspace = true }
craft-io = { workspace = true }
craft-codecs = { workspace = true }
craft-doc = { workspace = true }
craft-ui-egui = { workspace = true }
craft-raster = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["wgpu", "accesskit", "clipboard"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "DomRect", "HtmlAnchorElement",
    "Blob", "BlobPropertyBag", "Url", "Location",
    "CssStyleDeclaration", "Storage", "Event", "EventTarget",
    "MouseEvent", "PointerEvent", "BeforeUnloadEvent",
    "AbortController", "AbortSignal", "DomException",
    "Response", "IdbFactory", "IdbOpenDbRequest",
    "IdbDatabase", "IdbRequest", "IdbTransaction",
    "IdbTransactionMode", "IdbObjectStore", "IdbCursor",
    "IdbCursorWithValue", "RequestInit", "RequestMode",
    "Navigator", "ErrorEvent", "PromiseRejectionEvent"
] }

[dev-dependencies]
serde_json = { workspace = true }
craft-paint = { workspace = true }
craft-psd = { workspace = true }
